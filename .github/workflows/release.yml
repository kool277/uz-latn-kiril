name: Release

# On a tag v*: every suite (ci.yml), the Android APK (android.yml), the desktop packages (desktop.yml) and the Office
# installer (office-installer.yml) are built in this run, and only when all of them pass is a GitHub release published
# with every file a user installs.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  conformance:
    uses: ./.github/workflows/ci.yml
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit      # the upload key: the release ships the signed APK and bundle
  desktop:
    uses: ./.github/workflows/desktop.yml
  office-installer:
    uses: ./.github/workflows/office-installer.yml

  publish:
    name: Publish the release
    needs: [conformance, android, desktop, office-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            core/wasm/package-lock.json
            web/package-lock.json
      - name: The committed LibreOffice extensions are built from the current sources
        run: |
          python3 tools/make_lo_basic.py
          python3 tools/build_oxt.py
          git diff --exit-code -- libreoffice/
      - name: Office and LibreOffice files
        run: |
          mkdir -p dist kit/ribbon
          cp office-vba/UzTranslit.bas office-vba/UzTranslitRibbon.bas libreoffice/UzTranslitLO.bas libreoffice/*.oxt dist/
          cp platforms/office-addin/manifest.xml dist/uztranslit-office-addin.xml
          cp -r office-vba/ribbon/. kit/ribbon/
          cp office-vba/UzTranslit.bas office-vba/UzTranslitRibbon.bas tools/add_ribbon.py docs/OFFICE_INSTALL.md kit/
          sed -i 's|os.path.join(ROOT, "office-vba", "ribbon")|os.path.join(os.path.dirname(os.path.abspath(__file__)), "ribbon")|' kit/add_ribbon.py
          (cd kit && zip -qr ../dist/UzTranslit-ribbon-kit.zip .)
      - uses: actions/download-artifact@v7
        with:
          pattern: uztranslit-*
          path: artifacts
          merge-multiple: true
      - name: Apps
        run: |
          version="${GITHUB_REF_NAME#v}"
          find artifacts -type f | sort
          cp artifacts/app-release.apk "dist/UzTranslit-$version-android.apk"
          cp artifacts/app-release.aab "dist/UzTranslit-$version-android.aab"
          cp artifacts/UzTranslit-Office-Setup.exe "dist/UzTranslit-$version-Office-Setup.exe"
          find artifacts -name 'UzTranslit-*' \( -name '*.AppImage' -o -name '*-setup.exe' -o -name '*.dmg' \) -exec cp {} dist/ \;
      - name: Web app (self-hosted copy of latin.jaybi.uz, served from the root of any static web server)
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          (cd dist/uztranslit-web/browser && rm -f CNAME && zip -qr "../../../../dist/UzTranslit-${GITHUB_REF_NAME#v}-web.zip" .)
      - name: Checksums
        run: |
          ls -l dist
          test "$(ls dist | wc -l)" -ge 14
          python3 tools/release_notes.py "$GITHUB_REF_NAME" dist > notes.md
          (cd dist && sha256sum -- * > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "UzTranslit $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
