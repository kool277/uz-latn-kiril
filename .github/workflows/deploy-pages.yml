name: Deploy latin.jaybi.uz

# Publishes web/ to GitHub Pages after CI has passed on main (or by hand; release.yml runs it after publishing, so the
# download buttons point at the new release). The site ships the tested engine: the build compiles core/wasm and
# copies it in (web/scripts/sync-core.mjs).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # only a successful CI run of a push to this repository: the `branches` filter matches the head branch
    # *name*, so without these checks a fork's pull request from a branch called "main" could get deployed
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            core/wasm/package-lock.json
            web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v6
      - name: The latest published release (the download buttons link to its files)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view --repo "$GITHUB_REPOSITORY" --json tagName,assets > "$RUNNER_TEMP/release.json" || echo "no release yet"
      - name: Build
        working-directory: web
        env:
          UZT_RELEASE_JSON: ${{ runner.temp }}/release.json
          # "/<repo>" while the site lives on <user>.github.io; configure-pages can still report it for a while
          # after the custom domain is switched on, so a domain in public/CNAME always means the root path
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -s public/CNAME ]; then BASE_PATH=""; else BASE_PATH="$PAGES_BASE_PATH"; fi
          echo "base href: $BASE_PATH/"
          npm ci --no-audit --no-fund
          npm run build -- --base-href "$BASE_PATH/"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist/uztranslit-web/browser

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
