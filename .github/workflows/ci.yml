name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: Conformance (JS, Python, WebAssembly, LibreOffice Basic, document formats)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            core/wasm/package-lock.json
            web/package-lock.json
      - name: Install LibreOffice (Basic test runner, both extension editions, document round-trips)
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress python3-uno \
            libreoffice-script-provider-python
      - name: Run every suite
        run: tools/test_all.sh

  web:
    name: Web app (build, unit tests, Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            core/wasm/package-lock.json
            web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: No known vulnerabilities in shipped dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
