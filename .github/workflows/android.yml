name: Android

# Unit tests of platforms/android (engine fixtures, differential test against core/js, app logic) and a debug APK.
on:
  push:
    branches: [main]
    paths:
      - platforms/android/**
      - spec/**
      - core/js/**
      - tools/make_differential.mjs
      - tools/random-text.mjs
      - .github/workflows/android.yml
  pull_request:
    paths:
      - platforms/android/**
      - spec/**
      - core/js/**
      - tools/make_differential.mjs
      - tools/random-text.mjs
      - .github/workflows/android.yml
  workflow_dispatch:
  workflow_call:      # release.yml builds the release files with it

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (fixtures, differential test, unit tests, debug APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Differential corpus from the reference implementation (build/differential.json)
        run: node tools/make_differential.mjs
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # the MIT-licensed provider (the default one is proprietary)
      - name: Android SDK platform 37 and build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Unit tests and debug APK
        working-directory: platforms/android
        run: ./gradlew test assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: uztranslit-android-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: |
            platforms/android/core/build/reports/tests
            platforms/android/app/build/reports/tests
          retention-days: 7
