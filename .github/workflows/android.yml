name: Android

# Unit tests of platforms/android (engine fixtures, differential test against core/js, app logic) and a debug APK.
on:
  push:
    branches: [main]
    paths:
      - platforms/android/**
      - spec/**
      - core/js/**
      - tools/make_differential.mjs
      - tools/random-text.mjs
      - .github/workflows/android.yml
  pull_request:
    paths:
      - platforms/android/**
      - spec/**
      - core/js/**
      - tools/make_differential.mjs
      - tools/random-text.mjs
      - .github/workflows/android.yml
  workflow_dispatch:
  workflow_call:      # release.yml builds the release files with it

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (fixtures, differential test, unit tests, APK and bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # the upload key (README.md ▸ Signing) is not available to pull requests from forks: they build debug only
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Differential corpus from the reference implementation (build/differential.json)
        run: node tools/make_differential.mjs
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic # the MIT-licensed provider (the default one is proprietary)
      - name: Android SDK platform 37 and build tools
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Unit tests and debug APK
        working-directory: platforms/android
        run: ./gradlew test assembleDebug
      - uses: actions/upload-artifact@v7
        with:
          name: uztranslit-android-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Release APK and bundle, signed with the upload key
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: platforms/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UZT_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UZT_UPLOAD_KEY_ALIAS: upload      # not a secret (a secret "upload" would mask the word in every log line)
        run: |
          export UZT_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$UZT_UPLOAD_STORE_FILE"
          ./gradlew assembleRelease bundleRelease
          rm -f "$UZT_UPLOAD_STORE_FILE"
      - name: Both are signed with the upload certificate (platforms/android/upload-certificate.sha256)
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: platforms/android
        run: |
          expected=$(cat upload-certificate.sha256)
          apk=app/build/outputs/apk/release/app-release.apk aab=app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | tee apk-cert.txt
          grep -q "certificate SHA-256 digest: $expected" apk-cert.txt
          jarsigner -verify "$aab" | grep -q "jar verified"
          keytool -printcert -jarfile "$aab" | grep "SHA256:" | tr -d ': \t' | sed 's/SHA256//' | tr 'A-F' 'a-f' | grep -qx "$expected"
          echo "APK and bundle signed with $expected"
      - name: Enable KVM for the emulator
        if: env.HAS_UPLOAD_KEY == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The shrunk release APK starts and converts (emulator, Android 14)
        if: env.HAS_UPLOAD_KEY == 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: platforms/android/scripts/smoke-test.sh platforms/android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v7
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: uztranslit-android-release
          path: |
            platforms/android/app/build/outputs/apk/release/app-release.apk
            platforms/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-test-reports
          path: |
            platforms/android/core/build/reports/tests
            platforms/android/app/build/reports/tests
          retention-days: 7
