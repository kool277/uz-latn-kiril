<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Office.js comes from Microsoft's CDN (required for add-ins); everything else is served from here -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline' https://appsforoffice.microsoft.com; img-src 'self' data: https://appsforoffice.microsoft.com; connect-src 'self' https://*.microsoft.com https://*.office.com https://*.office.net https://*.officeapps.live.com; frame-src https://*.microsoft.com https://*.office.com https://*.office.net https://*.officeapps.live.com https://*.sharepoint.com; font-src 'self' https://*.office.net; object-src 'none'; base-uri 'self'; form-action 'none'">
  <title>UzTranslit</title>
  <link rel="icon" href="icon-32.png">
  <link rel="stylesheet" href="taskpane.css">
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <!-- deferred: they run after the page is parsed, in this order (Office may report ready before the body exists) -->
  <script src="uztranslit.js" defer></script>
  <script src="addin.js" defer></script>
  <script src="taskpane.js" defer></script>
</head>
<body>
  <main>
    <h1><img src="icon-32.png" alt="" width="24" height="24"> UzTranslit</h1>
    <p class="lead" data-i18n="lead">Oʻzbek matni: Kirill ⇄ Lotin 1995 ⇄ Yangi lotin. Formatlash saqlanadi.</p>

    <label for="from" data-i18n="from">Manba yozuv</label>
    <select id="from">
      <option value="auto" data-i18n="auto">Avto (aniqlash)</option>
      <option value="cyr" data-i18n="cyr">Кирилл</option>
      <option value="lat" data-i18n="lat">Lotin 1995</option>
      <option value="new" data-i18n="new">Yangi lotin</option>
    </select>

    <label for="to" data-i18n="to">Natija yozuvi</label>
    <select id="to">
      <option value="new" data-i18n="newLong">Yangi lotin (Ö Ğ Ş Ç)</option>
      <option value="lat" data-i18n="lat">Lotin 1995</option>
      <option value="cyr" data-i18n="cyr">Кирилл</option>
    </select>

    <fieldset>
      <legend data-i18n="where">Qayerda</legend>
      <label class="inline"><input type="radio" name="where" id="sel" value="sel" checked> <span data-i18n="selection">Belgilangan joy (boʻlmasa — butun hujjat)</span></label>
      <label class="inline"><input type="radio" name="where" id="all" value="all"> <span data-i18n="document">Butun hujjat</span></label>
    </fieldset>

    <label class="inline"><input type="checkbox" id="ascii"> <span data-i18n="ascii">Oddiy apostrof (') ishlatilsin</span></label>

    <button id="go" type="button" disabled data-i18n="go">Oʻgirish</button>
    <p id="status" role="status" aria-live="polite"></p>

    <footer>
      <a href="https://latin.jaybi.uz/" target="_blank" rel="noopener">latin.jaybi.uz</a> ·
      <select id="lang" aria-label="Til / Язык / Language">
        <option value="uz">Oʻzbekcha</option>
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </footer>
  </main>
</body>
</html>
